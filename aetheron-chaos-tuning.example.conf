# aetheron-chaos-tuning.conf — copy this file next to level.dat (the world folder) as
# "aetheron-chaos-tuning.conf" and the realm reads it at world load. Restart the server
# to re-read it. Every value below is the built-in default; delete any line to keep it.
# Unknown keys are ignored (with a log line), so typos never break the realm.

# --- levels & experience -----------------------------------------------------------
game.max_level = 40                 # the level cap; past it, XP feeds paragon tiers
paragon.base_xp = 2000              # XP for the first paragon tier
paragon.step_xp = 1500              # each further tier costs this much more
paragon.xp_bonus_percent = 3        # +XP% earned per paragon tier
paragon.xp_bonus_cap_percent = 50   # ...to this ceiling
healer.xp_per_hp = 2.0              # support XP per HP actually healed onto another hero

# --- the trinity -------------------------------------------------------------------
threat.defender_window_seconds = 5  # how long a mob hears you louder after it turns away
threat.defender_bonus = 1.5         # ...and how much louder (1.5 = half again)
# per-spell cooldowns, in ticks (20 = 1s). The spell id is what /quest spell shows:
spell.cooldown.taunt = 80           # warrior Taunt (its own track - see AGENTS.md)
spell.cooldown.challenge = 200      # paladin Challenge (its own track)
# spell.cooldown.fire-bolt = 20     # ...any other spell by the same key shape

# --- the town's watch --------------------------------------------------------------
guard.health_scale = 0.6            # hub golems' health vs a real iron golem
guard.attack_scale = 0.7            # ...and their attack
barracks.guard_health_bonus = 1.15  # extra keep for guards where a barracks stands
town.barracks_gold = 150            # what a hero pays to raise a barracks

# --- markets, guilds, forge ----------------------------------------------------------
trade.max_price = 5000              # the highest a trade-post seller may name
trade.npc_floor_fraction = 0.5      # the merchant pays this share of asking for postings left overnight
invasion.pride_gold_per_kill = 2    # siege pay for members of a guild whose banner flies at the besieged hub
stash.max_slots = 27                # stacks one hero may keep on their stash shelf
stash.deposit_gold = 2              # the bank's fee per stored stack (withdraw is free)
guild.create_gold = 100             # a guild charter
guild.banner_gold = 200             # ...and a banner on the plaza's edge
guild.daily_goal = 20               # monsters the guild shares a day
guild.daily_reward_gold = 20        # ...and what each member claims
forge.reroll_gold = 120             # re-forging a legendary
forge.reroll_sigils = 1
# per-item prices, by the ids /quest shop and /quest forge show:
# shop.price.iron-sword = 30
# forge.gold.dawnbreaker = 260
